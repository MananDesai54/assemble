name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # serial: parallel jobs race electron-builder's find-or-create draft
      # and produce duplicate draft releases for the same tag
      max-parallel: 1
      matrix:
        include:
          # no intel-mac job: macos-13 (last x64) runners are retired — jobs
          # queue forever. Intel macs get the installer's source fallback.
          - os: macos-14 # apple silicon
            arch: arm64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Sync version from tag
        # electron-builder reads package.json version for artifact names and
        # the target release — inject it from the tag (build-time only, never
        # committed) so the tag is the single source of truth.
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build renderer + main
        working-directory: apps/desktop
        run: node build.mjs
      - name: Stage server (bundled js + per-arch ML node_modules)
        working-directory: apps/desktop
        run: node scripts/stage-server.mjs
      - name: Package + publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --publish always --${{ matrix.arch }}

  publish:
    # electron-builder leaves the release as a draft — flip it live once
    # every platform's assets are uploaded
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
