<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:4817; style-src 'unsafe-inline'" />
<style>
  :root { --bg: #10152a; --ink: #e7eaff; --dim: #8891b8; --line: #232c52; --grad: linear-gradient(135deg, #7c8cff, #37c8dd); }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --ink: #1a1f3d; --dim: #5f6890; --line: #d6dbef; --grad: linear-gradient(135deg, #4f5df0, #00a8c6); }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); padding: 8px; }
  .panel {
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.45); padding: 14px; display: flex;
    flex-direction: column; gap: 10px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--grad); flex-shrink: 0; }
  .dot.busy { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: 0.5; } }
  input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--ink); font: 16px/1.4 inherit;
  }
  input::placeholder { color: var(--dim); }
  .hint { color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; }
  kbd { background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 4px; padding: 1px 5px; font: 11px ui-monospace, monospace; }
  #answer {
    display: none; white-space: pre-wrap; max-height: 190px; overflow-y: auto;
    border-top: 1px solid var(--line); padding-top: 10px; color: var(--ink);
  }
  #answer.on { display: block; }
</style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <span class="dot" id="dot"></span>
      <input id="q" placeholder="Ask assemble anything…" autofocus />
    </div>
    <div id="answer"></div>
    <div class="hint">
      <span><kbd>↵</kbd> quick answer · <kbd>⌘↵</kbd> continue in app</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
  <script type="module" src="./quick.js"></script>
</body>
</html>
